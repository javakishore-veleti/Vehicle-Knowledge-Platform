# Postgres + pgVector for localhost.
# Uses the pgvector image already present on this machine (pgvector/pgvector:pg16) -
# do NOT introduce a new postgres image.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vkp-postgres
    environment:
      POSTGRES_USER: vkp
      POSTGRES_PASSWORD: vkp
      # One database named `postgres` (the default). The codebase's logical "DBs" are SCHEMAS inside
      # it (see initdb/02-schemas.sql) — not separate databases — to keep one lean Postgres instance.
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - vkp-postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vkp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vkp-postgres-data:
