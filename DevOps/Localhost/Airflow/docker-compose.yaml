# Apache Airflow for localhost (LocalExecutor).
# Uses the airflow image already present on this machine (apache/airflow:2.10.0-python3.12)
# and postgres:16 (also present) for Airflow's own metadata database.
#
# DAGs are mounted from Middleware/Workflows/AirflowDAGS, which is organized
# categorically (e.g. Vehicles/DataCollection, Vehicles/Ingestion).
x-airflow-common: &airflow-common
  image: apache/airflow:2.10.0-python3.12
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  volumes:
    # Mount the categorically-organized DAG tree (recursively discovered by Airflow).
    - ../../../Middleware/Workflows/AirflowDAGS:/opt/airflow/dags
    - vkp-airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16
    container_name: vkp-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - vkp-airflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: vkp-airflow-init
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          airflow users create --username admin --password admin
          --firstname admin --lastname admin --role Admin
          --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: vkp-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: vkp-airflow-scheduler
    command: scheduler
    restart: unless-stopped

volumes:
  vkp-airflow-pg:
  vkp-airflow-logs:
