# VKP localhost observability stack — reuses images already on the machine:
#   jaegertracing/all-in-one:1.62.0  (OTLP ingest + trace UI)
#   prom/prometheus:v2.53.0          (metrics scrape)
#   grafana/grafana:10.4.2           (dashboards over Prometheus + Jaeger)
#
# Services run on the HOST (java -jar / uvicorn), so:
#   - they EXPORT traces (OTLP) to localhost:4318 (Jaeger publishes the port)
#   - Prometheus (in-container) SCRAPES them via host.docker.internal:<port>
name: vkp-observability

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: vkp-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: vkp-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so scrape targets can use host.docker.internal on Linux
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: vkp-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped
