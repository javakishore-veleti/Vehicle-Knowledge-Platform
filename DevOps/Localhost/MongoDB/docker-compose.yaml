# MongoDB (with local Atlas-style Vector Search) for localhost.
#
# NOTE: As of writing, no MongoDB image is present on this machine, so the first
# `up` will PULL the image below. mongodb-atlas-local bundles the search/vector
# capability so Atlas Vector Search can be exercised locally. If you only need a
# plain document store, swap the image for `mongo:7`.
services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: vkp-mongodb
    # No auth for localhost dev: atlas-local runs as a single-node replica set, and enabling
    # root auth requires an internal-auth keyfile it doesn't auto-provision (it crash-loops on
    # "Unable to acquire security key[s]"). Services connect with mongodb://localhost:27017/vkp.
    ports:
      - "27017:27017"
    volumes:
      - vkp-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vkp-mongodb-data:
