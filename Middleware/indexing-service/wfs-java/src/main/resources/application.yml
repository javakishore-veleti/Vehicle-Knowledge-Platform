# indexing-service-wfs-java — Spring-AI indexing executor.
server:
  port: 8087

spring:
  application:
    name: indexing-service-wfs-java

# Control-plane base URL for status callbacks.
wfs:
  control-base-url: ${WFS_CONTROL_BASE_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
