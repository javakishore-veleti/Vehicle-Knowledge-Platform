# indexing-service-wfs-java — Spring-AI indexing executor.
server:
  port: 8087

spring:
  application:
    name: indexing-service-wfs-java
  # pgVector datasource for vector writes (vec_<model> tables). Startup tolerates pg being down.
  datasource:
    url: ${WFS_PG_URL:jdbc:postgresql://localhost:5432/vkp}
    username: ${WFS_PG_USER:vkp}
    password: ${WFS_PG_PASSWORD:vkp}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 0
      connection-timeout: 5000
      initialization-fail-timeout: -1
  # MongoDB Atlas Vector Search store (used when a formula's vector_store = mongodb).
  data:
    mongodb:
      uri: ${WFS_MONGO_URI:mongodb://localhost:27017/vkp?directConnection=true}
      auto-index-creation: false

# Executor settings.
wfs:
  control-base-url: ${WFS_CONTROL_BASE_URL:http://localhost:8086}
  data-collection-base-url: ${WFS_DC_BASE_URL:http://localhost:8084}
  chunk-size: 512
  chunk-overlap: 64
  dim: 384

management:
  health:
    # Mongo is only used for the mongodb vector store; a flaky/absent Mongo must not fail the
    # executor's own liveness. Per-run Mongo errors are reported on the index log instead.
    mongo:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
