# indexing-service-wfs-java — Spring-AI indexing executor.
server:
  port: 8087

spring:
  application:
    name: indexing-service-wfs-java
  # pgVector datasource for vector writes (vec_<model> tables). Startup tolerates pg being down.
  datasource:
    url: ${WFS_PG_URL:jdbc:postgresql://localhost:5432/vkp}
    username: ${WFS_PG_USER:vkp}
    password: ${WFS_PG_PASSWORD:vkp}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 0
      connection-timeout: 5000
      initialization-fail-timeout: -1

# Executor settings.
wfs:
  control-base-url: ${WFS_CONTROL_BASE_URL:http://localhost:8086}
  data-collection-base-url: ${WFS_DC_BASE_URL:http://localhost:8084}
  chunk-size: 512
  chunk-overlap: 64
  dim: 384

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
