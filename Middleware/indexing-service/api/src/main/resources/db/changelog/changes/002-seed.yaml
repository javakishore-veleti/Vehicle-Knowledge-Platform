              - { column: { name: provider_credential_id, value: "c0000000-0000-4000-8000-000000000001" } }
              - { column: { name: provider_type, value: "sentence-transformers" } }
              - { column: { name: name, value: "local-sentence-transformers" } }
              - { column: { name: config, value: '{}' } }
