  - changeSet:
      id: 002-seed-workflows
      author: vkp
      comment: Two interchangeable executors for sentence-transformers -> pgVector
      changes:
        - insert:
            tableName: indexing_workflow
            columns:
              - { column: { name: wf_id, value: "10000000-0000-4000-9000-000000000001" } }
              - { column: { name: name, value: "Sentence-Transformers -> pgVector (Airflow)" } }
              - { column: { name: wf_type, value: "AIRFLOW" } }
              - { column: { name: target_ref, value: "vkp_index_sentence_transformers" } }
              - { column: { name: description, value: "Python DAG: chunk + embed (sentence-transformers) into pgVector" } }
              - { column: { name: status, value: "ACTIVE" } }
              - { column: { name: created_dt, valueDate: "2026-06-02T00:00:00" } }
              - { column: { name: updated_dt, valueDate: "2026-06-02T00:00:00" } }
              - { column: { name: created_by, value: "liquibase-seed" } }
              - { column: { name: updated_by, value: "liquibase-seed" } }
        - insert:
            tableName: indexing_workflow
            columns:
              - { column: { name: wf_id, value: "10000000-0000-4000-9000-000000000002" } }
              - { column: { name: name, value: "Sentence-Transformers -> pgVector (Spring AI)" } }
              - { column: { name: wf_type, value: "SPRING_AI" } }
              - { column: { name: target_ref, value: "springAiSentenceTransformers" } }
              - { column: { name: description, value: "Spring AI executor (wfs-java): TransformersEmbeddingModel into PgVectorStore" } }
              - { column: { name: status, value: "ACTIVE" } }
              - { column: { name: created_dt, valueDate: "2026-06-02T00:00:00" } }
              - { column: { name: updated_dt, valueDate: "2026-06-02T00:00:00" } }
              - { column: { name: created_by, value: "liquibase-seed" } }
              - { column: { name: updated_by, value: "liquibase-seed" } }
