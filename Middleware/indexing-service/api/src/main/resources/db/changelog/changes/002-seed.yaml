databaseChangeLog:
  - changeSet:
      id: 002-seed-index-formula
      author: vkp
      changes:
        - insert:
            tableName: index_formula
            columns:
              - { column: { name: index_formula_id, value: "f0000000-0000-4000-8000-000000000001" } }
              - { column: { name: name, value: "minilm-default" } }
              - { column: { name: embedding_provider, value: "sentence-transformers" } }
              - { column: { name: embedding_model, value: "all-MiniLM-L6-v2" } }
              - { column: { name: params, value: '{"chunk_size":512,"chunk_overlap":64,"dim":384}' } }
              - { column: { name: status, value: "ACTIVE" } }
              - { column: { name: created_dt, valueDate: "2026-06-02T00:00:00" } }
              - { column: { name: updated_dt, valueDate: "2026-06-02T00:00:00" } }
              - { column: { name: created_by, value: "liquibase-seed" } }
              - { column: { name: updated_by, value: "liquibase-seed" } }

  - changeSet:
      id: 002-seed-provider-credentials
      author: vkp
      changes:
