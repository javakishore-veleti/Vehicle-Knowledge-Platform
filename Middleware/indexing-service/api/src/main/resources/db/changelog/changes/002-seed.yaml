            tableName: provider_credentials
            columns:
              - { column: { name: provider_credential_id, value: "c0000000-0000-4000-8000-000000000002" } }
              - { column: { name: provider_type, value: "pgvector" } }
              - { column: { name: name, value: "local-pgvector" } }
