# Airflow Adapter Service. Stateless gateway - no database.
server:
  port: 8083

spring:
  application:
    name: airflow-adapter-service

# Target Airflow REST API. Override per environment (e.g. AIRFLOW_BASE_URL).
airflow:
  base-url: ${AIRFLOW_BASE_URL:http://localhost:8080}
  username: ${AIRFLOW_USERNAME:admin}
  password: ${AIRFLOW_PASSWORD:admin}

management:
  tracing:
    sampling:
      probability: ${VKP_TRACE_SAMPLING:1.0}      # sample all spans in dev; lower in prod
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}   # Jaeger OTLP/HTTP
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Swagger UI -> /swagger-ui.html ; OpenAPI JSON -> /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Shared session encryption (vkp-session-security). Same VKP_SESSION_SECRET across all services.
vkp:
  session:
    secret: ${VKP_SESSION_SECRET:}
    header: X-VKP-Session
  jwt:
    enabled: ${VKP_JWT_ENABLED:true}
    secret: ${JWT_SECRET:change-me-dev-secret-please-override-in-prod-0123456789}   # MUST match user-service jwt.secret
    # /internal/airflow/** -> service-to-service; set internal-api-key to require X-VKP-Internal-Key
    internal-api-key: ${VKP_INTERNAL_API_KEY:}
