# Default profile: in-memory H2. No external dependencies required.
server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  tracing:
    sampling:
      probability: ${VKP_TRACE_SAMPLING:1.0}      # sample all spans in dev; lower in prod
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}   # Jaeger OTLP/HTTP
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Swagger UI -> /swagger-ui.html ; OpenAPI JSON -> /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# JWT signing. Override jwt.secret (>= 32 bytes) per environment / via JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:change-me-dev-secret-please-override-in-prod-0123456789}
  expiration-minutes: 60

# Shared session encryption (vkp-session-security). Set VKP_SESSION_SECRET to a base64 32-byte key,
# SAME value across every service that issues/reads the token (blank => random dev key, single-service only).
vkp:
  session:
    secret: ${VKP_SESSION_SECRET:}
    header: X-VKP-Session
  jwt:
    enabled: ${VKP_JWT_ENABLED:true}
    secret: ${JWT_SECRET:change-me-dev-secret-please-override-in-prod-0123456789}   # MUST match user-service jwt.secret
    permit-patterns:                       # public: you can't have a token before signing in
      - /customer/user/service/v1/auth/**
      - /customer/user/service/v1/session/**
