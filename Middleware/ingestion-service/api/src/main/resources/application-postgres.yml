# Postgres profile: run with -Dspring-boot.run.profiles=postgres (or SPRING_PROFILES_ACTIVE=postgres).
# Targets the localhost pgvector container from DevOps/Localhost/Postgres/docker-compose.yaml.
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    driver-class-name: org.postgresql.Driver
    username: vkp
    password: vkp
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: ${VKP_PG_SCHEMA:vkp_ingestion}
        hbm2ddl:
          create_namespaces: true
