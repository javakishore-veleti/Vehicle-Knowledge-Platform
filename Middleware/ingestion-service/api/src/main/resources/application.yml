# Default profile: in-memory H2. No external dependencies required.
server:
  port: 8085

# airflow-adapter-service base URL (the only component that talks to Airflow).
airflow-adapter:
  base-url: ${AIRFLOW_ADAPTER_BASE_URL:http://localhost:8083}

# URLs the ingestion DAG (running in the Airflow container) uses:
#   graph-base-url    -> data-collection-service, to fetch discovered links
#   callback-base-url -> this service, to post back extracted content
ingestion:
  graph-base-url: ${INGESTION_GRAPH_BASE_URL:http://host.docker.internal:8084}
  callback-base-url: ${INGESTION_CALLBACK_BASE_URL:http://host.docker.internal:8085}

spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:h2:mem:ingestiondb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Swagger UI -> /swagger-ui.html ; OpenAPI JSON -> /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Shared session encryption (vkp-session-security). Same VKP_SESSION_SECRET across all services.
vkp:
  session:
    secret: ${VKP_SESSION_SECRET:}
    header: X-VKP-Session
