# Add to prometheus.yml scrape_configs. The Java services already expose /actuator/prometheus;
# this scrapes the Python explore service's /metrics.
scrape_configs:
  - job_name: vehicle-explore-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8090"]   # or localhost:8090 if Prometheus runs on the host
        labels:
          application: vehicle-explore-service
