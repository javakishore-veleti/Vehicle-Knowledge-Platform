# Postgres profile: run with -Dspring-boot.run.profiles=postgres (or SPRING_PROFILES_ACTIVE=postgres).
# Targets the localhost pgvector container from DevOps/Localhost/Postgres/docker-compose.yaml.
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vkp
    driver-class-name: org.postgresql.Driver
    username: vkp
    password: vkp
  jpa:
    # Liquibase owns the schema + seed data; Hibernate must not alter it.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
