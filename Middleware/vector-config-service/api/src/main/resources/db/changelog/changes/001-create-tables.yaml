databaseChangeLog:
  - changeSet:
      id: 001-create-company-resource-vector-config
      author: vkp
      changes:
        - createTable:
            tableName: company_resource_vector_config
            columns:
              - column: { name: vector_config_id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: company_id, type: VARCHAR(36) }
              - column: { name: company_resource_id, type: VARCHAR(36) }
              - column: { name: vector_store_type, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: vector_store_name, type: VARCHAR(100) }
              - column: { name: collection_name, type: VARCHAR(100) }
              - column: { name: index_name, type: VARCHAR(100) }
              - column: { name: embedding_model, type: VARCHAR(100) }
              - column: { name: is_primary, type: BOOLEAN }
              - column: { name: status, type: VARCHAR(15) }
              - column: { name: addl_data, type: CLOB }
              - column: { name: created_dt, type: TIMESTAMP }
              - column: { name: updated_dt, type: TIMESTAMP }
              - column: { name: created_by, type: VARCHAR(50) }
              - column: { name: updated_by, type: VARCHAR(50) }
        - createIndex:
            indexName: idx_vec_cfg_company_resource_id
            tableName: company_resource_vector_config
            columns:
              - column: { name: company_resource_id }
        - createIndex:
            indexName: idx_vec_cfg_company_id
            tableName: company_resource_vector_config
            columns:
              - column: { name: company_id }
