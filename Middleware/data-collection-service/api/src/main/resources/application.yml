# Default profile: in-memory H2. No external dependencies required.
server:
  port: 8084

# airflow-adapter-service base URL (the only component that talks to Airflow).
airflow-adapter:
  base-url: ${AIRFLOW_ADAPTER_BASE_URL:http://localhost:8083}

spring:
  application:
    name: data-collection-service
  datasource:
    url: jdbc:h2:mem:datacollectiondb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  tracing:
    sampling:
      probability: ${VKP_TRACE_SAMPLING:1.0}      # sample all spans in dev; lower in prod
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}   # Jaeger OTLP/HTTP
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Swagger UI -> /swagger-ui.html ; OpenAPI JSON -> /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Shared session encryption (vkp-session-security). Same VKP_SESSION_SECRET across all services.
vkp:
  # Snapshot Browser storage backend (must match the crawl DAG's storage_backend).
  #   local (default) -> reads vkp.snapshot.location dir (falls back to datacollection.snapshot-dir)
  #   s3 | azure | gcs -> object storage (build with: mvn -Pcloud-snapshot). location = bucket/container:
  #     s3://my-bucket/prefix  |  my-container/prefix  |  gs://my-bucket/prefix
  snapshot:
    backend: ${VKP_SNAPSHOT_STORAGE_BACKEND:local}
    location: ${VKP_SNAPSHOT_STORAGE_LOCATION:}
  session:
    secret: ${VKP_SESSION_SECRET:}
    header: X-VKP-Session
  jwt:
    enabled: ${VKP_JWT_ENABLED:true}
    secret: ${JWT_SECRET:change-me-dev-secret-please-override-in-prod-0123456789}   # MUST match user-service jwt.secret
    permit-patterns:                       # DAG callback (no user token)
      - /admin/data-collection/service/v1/graph/record
