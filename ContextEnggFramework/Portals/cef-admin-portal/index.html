<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VKP · CEF Admin</title>
  <style>
    :root { --ink:#0c111d; --muted:#667085; --accent:#3538cd; --line:#eaecf0; }
    * { box-sizing:border-box; } body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:#f7f8fa; }
    header { background:#fff; border-bottom:1px solid var(--line); padding:.8rem 1.2rem; display:flex; align-items:center; gap:.6rem; }
    header b { font-size:1.05rem; } header .tag { font-size:.72rem; background:#ecfdf3; color:#067647; border-radius:10px; padding:.1rem .5rem; }
    .wrap { max-width:900px; margin:1rem auto; padding:0 1rem; }
    h3 { margin:1.2rem 0 .5rem; } .cfg { font-size:.8rem; color:var(--muted); margin-bottom:.4rem; }
    .cfg input { font-size:.8rem; padding:.25rem .4rem; border:1px solid #d0d5dd; border-radius:6px; }
    table { border-collapse:collapse; width:100%; background:#fff; font-size:.9rem; }
    th,td { border:1px solid var(--line); padding:.4rem .6rem; text-align:left; } th { background:#f9fafb; }
    .on { color:#16a34a; } .off { color:#d0d5dd; }
    .eval { background:#fff; border:1px solid var(--line); border-radius:10px; padding:1rem; margin-top:.6rem; }
    .eval input { padding:.5rem; border:1px solid #d0d5dd; border-radius:6px; width:60%; }
    .eval button { padding:.5rem 1rem; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; }
    .score span { display:inline-block; background:#f2f4f7; border-radius:8px; padding:.2rem .6rem; margin:.3rem .3rem 0 0; font-size:.82rem; }
    .score .good { background:#ecfdf3; color:#067647; } .score .bad { background:#fef3f2; color:#b42318; }
    pre { background:#0c111d; color:#d1e0ff; padding:.7rem; border-radius:8px; font-size:.8rem; white-space:pre-wrap; margin-top:.5rem; }
  </style>
</head>
<body>
  <header><b>⚙️ CEF Admin</b><span class="tag">Context Engineering Framework</span></header>
  <div class="wrap">
    <div class="cfg">Admin service <input id="api" value="http://localhost:8094" size="26"></div>

    <h3>Context Strategies</h3>
    <table id="tbl"><thead><tr><th>Name</th><th>Budget</th>
      <th>select</th><th>compress</th><th>order</th><th>isolate</th><th>format</th><th>status</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8">loading…</td></tr></tbody>
    </table>

    <h3>Eval Harness</h3>
    <div class="eval">
      <div>Run a golden query through the orchestrator and scorecard groundedness:</div>
      <div style="margin:.5rem 0;">
        <input id="q" value="What hybrid SUVs does Toyota offer?" />
        <button id="run">Run eval</button>
      </div>
      <div class="score" id="score"></div>
      <pre id="ans" hidden></pre>
    </div>
  </div>
  <script>
    const api = () => document.getElementById('api').value.replace(/\/$/, '');
    const tick = b => b ? '<span class="on">✓</span>' : '<span class="off">—</span>';

    async function loadStrategies() {
      try {
        const r = await fetch(api() + '/admin/context-engine/service/v1/crud/strategies');
        const list = await r.json();
        document.getElementById('rows').innerHTML = list.map(s =>
          `<tr><td><b>${s.name}</b><div style="color:#667085;font-size:.78rem">${s.description||''}</div></td>
           <td>${s.charBudget}</td><td>${tick(s.selectionEnabled)}</td><td>${tick(s.compressionEnabled)}</td>
           <td>${tick(s.orderingEnabled)}</td><td>${tick(s.isolationEnabled)}</td><td>${tick(s.formatEnabled)}</td>
           <td>${s.status}</td></tr>`).join('') || '<tr><td colspan="8">none</td></tr>';
      } catch (e) {
        document.getElementById('rows').innerHTML = `<tr><td colspan="8">Error — is context-admin (:8094) running? ${e}</td></tr>`;
      }
    }

    document.getElementById('run').addEventListener('click', async () => {
      const q = document.getElementById('q').value.trim(); if (!q) return;
      const score = document.getElementById('score'); score.innerHTML = 'running…';
      try {
        const r = await fetch(api() + '/admin/context-engine/service/v1/eval/run', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, companyId: '10000000-0000-4000-8000-000000000004' })
        });
        const d = await r.json(); const sc = d.scorecard || {};
        score.innerHTML =
          `<span class="${sc.grounded ? 'good' : 'bad'}">grounded: ${sc.grounded}</span>` +
          `<span>citations: ${sc.citationCount}</span><span>sources: ${sc.sourceCount}</span>` +
          `<span>${sc.latencyMs}ms</span>`;
        const ans = document.getElementById('ans'); ans.hidden = false; ans.textContent = d.answer || JSON.stringify(d, null, 2);
      } catch (e) { score.innerHTML = '<span class="bad">Error: ' + e + '</span>'; }
    });

    loadStrategies();
  </script>
</body>
</html>
