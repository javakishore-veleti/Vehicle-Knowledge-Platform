name: AWS_003_Setup_ECR
# Infra layer. Creates the 16 ECR repositories (vkp-*) via stack `vkp-ecr`. Independent of network/EKS.
on:
  workflow_dispatch:
    inputs:
      aws_region: { description: "AWS region", required: false, default: "us-east-1" }
  workflow_call:
    inputs:
      aws_region: { type: string, required: false, default: "us-east-1" }
    secrets:
      AWS_ACCESS_KEY_ID:     { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_SESSION_TOKEN:     { required: false }
permissions: { contents: read }
jobs:
  ecr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ inputs.aws_region }}
      - name: Deploy ECR stack (vkp-ecr)
        run: |
          aws cloudformation deploy \
            --stack-name vkp-ecr \
            --template-file Infra/cloudformation/03-ecr.yaml \
            --no-fail-on-empty-changeset \
            --tags project=vehicle-knowledge-platform
      - name: Registry URI
        run: aws cloudformation describe-stacks --stack-name vkp-ecr --query "Stacks[0].Outputs" --output table
