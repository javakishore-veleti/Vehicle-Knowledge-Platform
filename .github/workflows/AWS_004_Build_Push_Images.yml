name: AWS_004_Build_Push_Images
# Build layer. Builds all 16 VKP images and pushes them to ECR (mirrors build-images.yml, but the
# registry is the account's ECR instead of GHCR). Requires AWS_003 (the repos) first. Manual + reusable.
on:
  workflow_dispatch:
    inputs:
      aws_region: { description: "AWS region", required: false, default: "us-east-1" }
      image_tag:  { description: "Tag to push (deploy uses the same)", required: false, default: "latest" }
  workflow_call:
    inputs:
      aws_region: { type: string, required: false, default: "us-east-1" }
      image_tag:  { type: string, required: false, default: "latest" }
    secrets:
      AWS_ACCESS_KEY_ID:     { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_SESSION_TOKEN:     { required: false }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: vkp-company-service,         dockerfile: Infra/docker/java-service.Dockerfile,   context: Middleware, build_args: "SERVICE=company-service\nJAR_PATH=company-service/api/target/company-service.jar" }
          - { image: vkp-user-service,            dockerfile: Infra/docker/java-service.Dockerfile,   context: Middleware, build_args: "SERVICE=user-service\nJAR_PATH=user-service/api/target/user-service.jar" }
          - { image: vkp-airflow-adapter-service, dockerfile: Infra/docker/java-service.Dockerfile,   context: Middleware, build_args: "SERVICE=airflow-adapter-service\nJAR_PATH=airflow-adapter-service/api/target/airflow-adapter-service.jar" }
          - { image: vkp-data-collection-service, dockerfile: Infra/docker/java-service.Dockerfile,   context: Middleware, build_args: "SERVICE=data-collection-service\nJAR_PATH=data-collection-service/api/target/data-collection-service.jar" }
          - { image: vkp-ingestion-service,       dockerfile: Infra/docker/java-service.Dockerfile,   context: Middleware, build_args: "SERVICE=ingestion-service\nJAR_PATH=ingestion-service/api/target/ingestion-service.jar" }
          - { image: vkp-indexing-service,        dockerfile: Infra/docker/java-service.Dockerfile,   context: Middleware, build_args: "SERVICE=indexing-service\nJAR_PATH=indexing-service/api/target/indexing-service.jar" }
          - { image: vkp-indexing-wfs,            dockerfile: Infra/docker/java-service.Dockerfile,   context: Middleware, build_args: "SERVICE=indexing-service\nJAR_PATH=indexing-service/wfs-java/target/indexing-service-wfs-java.jar" }
          - { image: vkp-vector-config-service,   dockerfile: Infra/docker/java-service.Dockerfile,   context: Middleware, build_args: "SERVICE=vector-config-service\nJAR_PATH=vector-config-service/api/target/vector-config-service.jar" }
          - { image: vkp-vehicle-explore-service, dockerfile: Infra/docker/python-service.Dockerfile, context: Middleware/vehicle-explore-service, build_args: "" }
          - { image: vkp-guardrails-service,      dockerfile: Infra/docker/python-service.Dockerfile, context: Middleware/guardrails-service, build_args: "" }
          - { image: vkp-agentic-service,         dockerfile: Infra/docker/python-service.Dockerfile, context: Middleware/agentic-service, build_args: "" }
          - { image: vkp-context-engine-service,  dockerfile: Infra/docker/python-service.Dockerfile, context: ContextEnggFramework/Middleware/context-engine-service, build_args: "" }
          - { image: vkp-context-admin-service,   dockerfile: Infra/docker/java-single.Dockerfile,    context: ContextEnggFramework/Middleware/context-admin-service, build_args: "" }
          - { image: vkp-admin-portal,            dockerfile: Infra/docker/angular-portal.Dockerfile, context: Portals/admin-portal, build_args: "PROJECT=admin-portal" }
          - { image: vkp-vehicle-search-portal,   dockerfile: Infra/docker/angular-portal.Dockerfile, context: Portals/vehicle-search-portal, build_args: "PROJECT=vehicle-search-portal" }
          - { image: vkp-cef-portal,              dockerfile: Infra/docker/angular-portal.Dockerfile, context: ContextEnggFramework/Portals/cef-portal, build_args: "PROJECT=cef-portal" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ inputs.aws_region }}
      - name: ECR login
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REG="$ACCOUNT.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com"
          echo "REG=$REG" >> "$GITHUB_ENV"
          aws ecr get-login-password --region ${{ inputs.aws_region }} | docker login --username AWS --password-stdin "$REG"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ env.REG }}/${{ matrix.image }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
