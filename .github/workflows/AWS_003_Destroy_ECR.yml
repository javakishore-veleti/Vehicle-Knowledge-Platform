name: AWS_003_Destroy_ECR
# Deletes the `vkp-ecr` stack. Repositories use EmptyOnDelete, so images are removed with them.
on:
  workflow_dispatch:
    inputs:
      aws_region: { description: "AWS region", required: false, default: "us-east-1" }
  workflow_call:
    inputs:
      aws_region: { type: string, required: false, default: "us-east-1" }
    secrets:
      AWS_ACCESS_KEY_ID:     { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_SESSION_TOKEN:     { required: false }
permissions: { contents: read }
jobs:
  destroy-ecr:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ inputs.aws_region }}
      - name: Delete ECR stack
        run: |
          aws cloudformation delete-stack --stack-name vkp-ecr
          aws cloudformation wait stack-delete-complete --stack-name vkp-ecr
          echo "vkp-ecr deleted."
