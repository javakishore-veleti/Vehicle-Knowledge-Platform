<rect x="54" y="358" width="312" height="50" rx="8" fill="#faf8ff" stroke="#a855f7" stroke-width="1.5"/><text x="210.0" y="379.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">providers.py</text><text x="210.0" y="396.0" text-anchor="middle" font-size="11" fill="#64748b">LLM fan-out (compare N)</text>
