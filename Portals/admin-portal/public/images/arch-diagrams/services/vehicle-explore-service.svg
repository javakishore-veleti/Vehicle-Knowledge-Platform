<rect x="0" y="0" width="1180" height="760" fill="#ffffff"/>
<text x="590.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">vehicle-explore-service — architecture (:8090, FastAPI)</text>
<rect x="40" y="56" width="1100" height="56" rx="10" fill="#e6f0ff" stroke="#2563eb" stroke-width="1.5"/><text x="590.0" y="80.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">REST API  (app/main.py)</text><text x="590.0" y="97.0" text-anchor="middle" font-size="11" fill="#64748b">GET /roster · /frameworks · /providers   |   POST /{framework}/search · /collect · /index   |   GET /logs · /logs/{id}</text>
