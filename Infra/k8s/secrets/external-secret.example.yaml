# Production secrets via the External Secrets Operator (https://external-secrets.io) — install the
# operator in the cluster, then apply this INSTEAD of base/secret.example.yaml. It materialises the
# same `vkp-secrets` Secret the Deployments read via envFrom, sourced from your cloud secrets
# manager (swap the SecretStore provider for AWS / GCP / Azure / Vault).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vkp-store
spec:
  provider:
    aws:                       # <-- replace with gcpsm / azurekv / vault as needed
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: vkp-eso       # a ServiceAccount bound (IRSA/Workload Identity) to read secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vkp-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vkp-store
    kind: SecretStore
  target:
    name: vkp-secrets          # same name the Deployments' secretRef consumes
    creationPolicy: Owner
  data:
    - { secretKey: JWT_SECRET, remoteRef: { key: vkp/jwt-secret } }
    - { secretKey: VKP_SESSION_SECRET, remoteRef: { key: vkp/session-secret } }
    - { secretKey: SPRING_DATASOURCE_PASSWORD, remoteRef: { key: vkp/db-password } }
    - { secretKey: VKP_PG_PASSWORD, remoteRef: { key: vkp/db-password } }
    - { secretKey: WFS_PG_PASSWORD, remoteRef: { key: vkp/db-password } }
    - { secretKey: OPENAI_API_KEY, remoteRef: { key: vkp/openai-api-key } }
    - { secretKey: GROQ_API_KEY, remoteRef: { key: vkp/groq-api-key } }
