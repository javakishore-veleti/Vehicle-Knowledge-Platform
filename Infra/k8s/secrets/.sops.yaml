# SOPS config (https://github.com/getsops/sops) — the GitOps alternative to External Secrets:
# encrypt secret.yaml in-repo (only the data/stringData values), commit the ciphertext, and decrypt
# at apply time (`sops -d secret.enc.yaml | kubectl apply -f -`, or via the kustomize-sops plugin).
# Fill in ONE recipient (age key / KMS ARN / PGP fingerprint) for your environment.
creation_rules:
  - path_regex: Infra/k8s/.*secret.*\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    # age: age1qxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # kms: arn:aws:kms:us-east-1:111122223333:key/abcd-...
    # pgp: 0123456789ABCDEF0123456789ABCDEF01234567
