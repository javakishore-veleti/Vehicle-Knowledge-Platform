apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# In-cluster platform data stores (Postgres+pgvector, MongoDB). Apply into the same namespace as
# the app, AFTER the base (which provides the vkp-secrets the DB password reads from):
#   kubectl apply -k Infra/k8s/base
#   kubectl apply -k Infra/k8s/platform -n vkp
# Production: skip this and use managed databases (point the app ConfigMap at their endpoints).
namespace: vkp

resources:
  - postgres.yaml
  - mongodb.yaml
