# Path routing that the per-portal proxy.conf.json did in dev. Two hosts: the admin portal and the
# customer search portal, each serving its SPA at / and routing API audiences to the services.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vkp-admin
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: admin.vkp.local
      http:
        paths:
          - { path: /admin/company,         pathType: Prefix, backend: { service: { name: company-service, port: { number: 8081 } } } }
          - { path: /admin/data-collection,  pathType: Prefix, backend: { service: { name: data-collection, port: { number: 8084 } } } }
          - { path: /admin/ingestion,        pathType: Prefix, backend: { service: { name: ingestion,       port: { number: 8085 } } } }
          - { path: /admin/indexing,         pathType: Prefix, backend: { service: { name: indexing,        port: { number: 8086 } } } }
          - { path: /admin/context-engine,   pathType: Prefix, backend: { service: { name: context-admin,   port: { number: 8094 } } } }
          - { path: /customer/user,          pathType: Prefix, backend: { service: { name: user-service,    port: { number: 8082 } } } }
          - { path: /guardrails,             pathType: Prefix, backend: { service: { name: guardrails,       port: { number: 8091 } } } }
          - { path: /agentic,                pathType: Prefix, backend: { service: { name: agentic,          port: { number: 8092 } } } }
          - { path: /context-engine,         pathType: Prefix, backend: { service: { name: context-engine,  port: { number: 8093 } } } }
          - { path: /,                       pathType: Prefix, backend: { service: { name: admin-portal,     port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vkp-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: app.vkp.local
      http:
        paths:
          - { path: /api/vehicle-explore,    pathType: Prefix, backend: { service: { name: vehicle-explore, port: { number: 8090 } } } }
          - { path: /customer/user,          pathType: Prefix, backend: { service: { name: user-service,    port: { number: 8082 } } } }
          - { path: /,                       pathType: Prefix, backend: { service: { name: search-portal,    port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vkp-cef
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: cef.vkp.local
      http:
        paths:
          - { path: /context-engine,         pathType: Prefix, backend: { service: { name: context-engine, port: { number: 8093 } } } }
          - { path: /admin/context-engine,   pathType: Prefix, backend: { service: { name: context-admin,   port: { number: 8094 } } } }
          - { path: /,                       pathType: Prefix, backend: { service: { name: cef-portal,      port: { number: 80 } } } }
