apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-explore
  labels: { app: vehicle-explore, tier: python }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vehicle-explore }
  template:
    metadata:
      labels: { app: vehicle-explore, tier: python }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: vehicle-explore
          image: vkp/vehicle-explore-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: vkp-config
            - secretRef:
                name: vkp-secrets
          readinessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-explore
  labels: { app: vehicle-explore }
spec:
  selector: { app: vehicle-explore }
  ports:
    - port: 8090
      targetPort: 8090
