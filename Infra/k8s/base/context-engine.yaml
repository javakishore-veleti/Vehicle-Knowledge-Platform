apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-engine
  labels: { app: context-engine, tier: python, part-of: cef }
spec:
  replicas: 1
  selector:
    matchLabels: { app: context-engine }
  template:
    metadata:
      labels: { app: context-engine, tier: python, part-of: cef }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: context-engine
          image: vkp/context-engine-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8093
          env:
            - { name: PORT, value: "8093" }
          envFrom:
            - configMapRef:
                name: vkp-config
            - secretRef:
                name: vkp-secrets
          readinessProbe:
            httpGet: { path: /health, port: 8093 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8093 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: context-engine
  labels: { app: context-engine }
spec:
  selector: { app: context-engine }
  ports:
    - port: 8093
      targetPort: 8093
