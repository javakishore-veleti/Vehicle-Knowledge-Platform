apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic
  labels: { app: agentic, tier: python }
spec:
  replicas: 1
  selector:
    matchLabels: { app: agentic }
  template:
    metadata:
      labels: { app: agentic, tier: python }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: agentic
          image: vkp/agentic-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8092
          env:
            - { name: PORT, value: "8092" }   # the python-service image defaults to 8080
          envFrom:
            - configMapRef:
                name: vkp-config
            - secretRef:
                name: vkp-secrets
          readinessProbe:
            httpGet: { path: /health, port: 8092 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8092 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: agentic
  labels: { app: agentic }
spec:
  selector: { app: agentic }
  ports:
    - port: 8092
      targetPort: 8092
