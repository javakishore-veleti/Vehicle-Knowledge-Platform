# nginx for the Angular portals. Serves the SPA and falls back to index.html for client routing.
# API calls (/admin, /customer, /api, /guardrails) are NOT proxied here — the Kubernetes Ingress
# routes them to the backend services (the portal and APIs share a host).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets; never cache index.html.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
